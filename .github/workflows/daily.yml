name: Build Daily IG Post (publish)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Generate post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_HANDLE: "@valeriacruz_221"
        run: python make_post.py

      - name: Copy latest image to public/
        run: |
          mkdir -p public
          cp out/post.jpg public/latest.jpg
          cp out/post.json public/latest.json

      - name: Commit & push latest files
        run: |
          git config user.name "ig-agent-bot"
          git config user.email "ig-agent-bot@users.noreply.github.com"
          git add public/latest.jpg public/latest.json
          git commit -m "Update latest IG post" || echo "No changes"
          git push

      - name: Check public image URL (GitHub Pages)
        env:
          PUBLIC_IMAGE_URL: https://cami2001-l.github.io/PostDiario/public/latest.jpg
        run: |
          echo "Checking: $PUBLIC_IMAGE_URL"
          curl -I "$PUBLIC_IMAGE_URL"
          curl -L "$PUBLIC_IMAGE_URL" --output /tmp/latest.jpg
          file /tmp/latest.jpg
          ls -lh /tmp/latest.jpg

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_CAPTION_EXTRA: ${{ secrets.IG_CAPTION_EXTRA }}
          PUBLIC_IMAGE_URL: https://cami2001-l.github.io/PostDiario/public/latest.jpg
          GRAPH_API_VERSION: v25.0
        run: python publish_ig.py
